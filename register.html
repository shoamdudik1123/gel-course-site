<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>הרשמה לקורס לק ג'ל | אפק דודיק</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <nav class="nav">
      <ul class="nav-links">
        <li><a href="index.html">חזרה לאתר</a></li>
      </ul>
      <a href="index.html" class="logo">
        <img src="images/logo.png" alt="אפק דודיק" class="logo-img">
        <span class="logo-text">אפק דודיק</span>
      </a>
    </nav>
  </header>

  <main class="register-page">
    <section class="section register-section">
      <div class="container register-container">
        <h1 class="register-title">הרשמה לקורס לק ג'ל</h1>
        <p class="register-intro">מלאו את הפרטים ונחזור אליכם בהקדם לאשר את מקומכם בקורס.</p>

        <!-- להפעלת שליחה למייל: הירשמי ב־formspree.io, צרי טופס עם המייל shoamdudik1123@gmail.com והדביקי את ה־Form ID כאן -->
        <form id="register-form" class="register-form" action="#" method="post" novalidate
          data-formspree-id=""
          data-whatsapp="972543205622">
          <div class="form-group" data-field="name">
            <label for="reg-name">שם מלא <span class="required">*</span></label>
            <input type="text" id="reg-name" name="name" required placeholder="השם המלא" autocomplete="name">
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group" data-field="phone">
            <label for="reg-phone">טלפון <span class="required">*</span></label>
            <input type="tel" id="reg-phone" name="phone" required placeholder="05X-XXXXXXX" autocomplete="tel">
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group" data-field="email">
            <label for="reg-email">אימייל <span class="required">*</span></label>
            <input type="email" id="reg-email" name="email" required placeholder="example@email.com" autocomplete="email">
            <span class="error-message" aria-live="polite"></span>
          </div>

          <div class="form-group" data-field="message">
            <label for="reg-message">הודעה</label>
            <textarea id="reg-message" name="message" rows="4" placeholder="שאלות, הערות או מועד מועדף..."></textarea>
            <span class="error-message" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn-primary btn-submit">שליחת הרשמה</button>
        </form>

        <p class="register-note">שדות המסומנים ב־* חובה.</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>© קורס לק ג'ל, אפק דודיק</p>
    </div>
  </footer>

  <script src="register.js"></script>
</body>
</html>
